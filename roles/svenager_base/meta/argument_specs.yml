---
argument_specs:
  main:
    short_description: Baseline for Svenager-managed devices
    description:
      - Installs the packages every managed device needs to run jobs.
        The VNC server for remote view is a separate, assignable role
        (vnc_server).
    options:
      svenager_base_packages:
        type: list
        elements: str
        default: [git, ansible-core]
        description: Packages every managed device needs.
      svenager_update_public_key:
        type: str
        default: ""
        description:
          - Base64 raw Ed25519 public key the agent verifies self-updates
            against. Set it to enable "Update agent"; the base role writes it
            into the device's agent.json. Empty leaves agent.json untouched.
