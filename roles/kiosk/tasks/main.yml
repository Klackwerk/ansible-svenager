---
- name: Install kiosk packages
  ansible.builtin.apt:
    name:
      - cog
      - wayvnc
      - seatd
      - fonts-dejavu
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install kiosk compositor
  ansible.builtin.apt:
    name: "{{ 'sway' if kiosk_compositor == 'sway' else 'cage' }}"
    state: present

# Debian trixie ships cog 0.18.4, whose Wayland platform hands raw evdev
# button codes to WPE WebKit; since WebKit 2.46 those fire "auxclick"
# instead of "click", so pages ignore mouse clicks — locally and through
# the remote view alike. cog 0.18.5 fixes it but only reached sid; its
# build has the same dependency set, so install it from the Debian
# snapshot archive. Skipped once a fixed version is installed.
- name: Read installed cog version
  ansible.builtin.command:
    cmd: dpkg-query -W -f '${Version}' cog
  register: kiosk_cog_version
  changed_when: false
  when: ansible_distribution_release == 'trixie'

- name: Install click-fixed cog on Debian trixie
  vars:
    kiosk_cog_fix_arch: >-
      {{ {'aarch64': 'arm64', 'armv7l': 'armhf', 'x86_64': 'amd64'}
         .get(ansible_architecture, '') }}
    kiosk_cog_fix_deb: "cog_0.18.5-1_{{ kiosk_cog_fix_arch }}.deb"
    kiosk_cog_fix_sha256:
      arm64: 62bb42ca39ba1e5e7aedc201160e689b2327c17a23b0bd0ccf5a8ad59cd6dc68
      armhf: c3b698c9e3e8ab77a49e49abf1b40ef07e6c34fae52dedaa32511af00e792e6e
      amd64: 4d5a76480e2449185fd6b7dad88f0337f93882327b02d6e517ebf9d6b93a4f2b
  when:
    - ansible_distribution_release == 'trixie'
    - kiosk_cog_version.stdout is version('0.18.5', '<')
    - kiosk_cog_fix_arch in kiosk_cog_fix_sha256
  block:
    - name: Create kiosk package cache
      ansible.builtin.file:
        path: /var/cache/svenager-kiosk
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download cog 0.18.5
      ansible.builtin.get_url:
        url: "https://snapshot.debian.org/archive/debian/20250530T143637Z/pool/main/c/cog/{{ kiosk_cog_fix_deb }}"
        dest: "/var/cache/svenager-kiosk/{{ kiosk_cog_fix_deb }}"
        checksum: "sha256:{{ kiosk_cog_fix_sha256[kiosk_cog_fix_arch] }}"
        mode: "0644"

    - name: Install cog 0.18.5
      ansible.builtin.apt:
        deb: "/var/cache/svenager-kiosk/{{ kiosk_cog_fix_deb }}"
      notify: Restart kiosk

# Debian's seatd grants seat access to the "video" group (seatd -g video),
# and the PAM login session covers device access via logind.
- name: Create kiosk user
  ansible.builtin.user:
    name: "{{ kiosk_user }}"
    groups: [video, input, render]
    append: true
    shell: /usr/sbin/nologin

# systemd services get no logind runtime dir reliably; lingering creates a
# persistent /run/user/<uid> so the compositor finds XDG_RUNTIME_DIR.
- name: Enable lingering for the kiosk user
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ kiosk_user }}
    creates: "/var/lib/systemd/linger/{{ kiosk_user }}"
  when: ansible_service_mgr == 'systemd'

- name: Detect an installed display manager
  ansible.builtin.stat:
    path: /etc/systemd/system/display-manager.service
  register: kiosk_display_manager

# A pre-existing display manager (lightdm/gdm3/sddm) owns seat0, the GPU
# and tty7, so the kiosk compositor can never take the screen. Mask it —
# the kiosk service is the only thing driving the display.
# display-manager.service is only an alias symlink to the real unit and
# systemd refuses to mask an alias, so resolve and mask the target unit.
- name: Disable a conflicting display manager
  ansible.builtin.systemd:
    name: "{{ kiosk_display_manager.stat.lnk_source
      | default(kiosk_display_manager.stat.path) | basename }}"
    state: stopped
    masked: true
  when:
    - ansible_service_mgr == 'systemd'
    - kiosk_display_manager.stat.exists
  notify: Restart kiosk

- name: Create local page directory
  ansible.builtin.file:
    path: /usr/local/share/svenager-kiosk
    state: directory
    owner: root
    group: root
    mode: "0755"

# Stored on the device so the screen never goes blank when the server or
# the network is down; it probes both and shows their state.
- name: Install local kiosk status page
  ansible.builtin.template:
    src: kiosk-page.html.j2
    dest: /usr/local/share/svenager-kiosk/index.html
    owner: root
    group: root
    mode: "0644"
  notify: Restart kiosk

- name: Create kiosk config directory
  ansible.builtin.file:
    path: /etc/svenager-kiosk
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: kiosk_compositor == 'sway'

- name: Install sway kiosk config
  ansible.builtin.template:
    src: sway-config.j2
    dest: /etc/svenager-kiosk/sway.config
    owner: root
    group: root
    mode: "0644"
  when: kiosk_compositor == 'sway'
  notify: Restart kiosk

- name: Install kiosk session script
  ansible.builtin.template:
    src: kiosk-session.sh.j2
    dest: /usr/local/bin/kiosk-session.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart kiosk

- name: Install kiosk unit
  ansible.builtin.template:
    src: kiosk.service.j2
    dest: /etc/systemd/system/kiosk.service
    owner: root
    group: root
    mode: "0644"
  when: ansible_service_mgr == 'systemd'
  notify: Restart kiosk

- name: Boot into the graphical target
  ansible.builtin.file:
    src: /lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true
  when: ansible_service_mgr == 'systemd'

- name: Enable seatd and the kiosk session
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [seatd, kiosk]
  when: ansible_service_mgr == 'systemd'

# Self-heal: a restart driven only by a notify handler is lost when an
# earlier task in the apply fails, and the next, now-idempotent run never
# re-notifies — the new URL sits in the session script but the running
# browser keeps the old page. Check what cog actually shows and restart
# when it does not match, independent of any handler.
- name: Check whether the kiosk shows the configured URL
  ansible.builtin.command:
    cmd: pgrep -u {{ kiosk_user }} -f -- {{ ('cog .*' ~ (kiosk_url | regex_escape)) | quote }}
  register: kiosk_url_running
  changed_when: false
  failed_when: false
  when: ansible_service_mgr == 'systemd'

- name: Restart kiosk when it is not showing the configured URL
  ansible.builtin.systemd:
    name: kiosk
    state: restarted
    daemon_reload: true
  when:
    - ansible_service_mgr == 'systemd'
    - kiosk_url_running.rc | default(1) != 0
