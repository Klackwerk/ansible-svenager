---
# What the kiosk shows fullscreen. The default is a status page stored ON
# the device, so the screen keeps working (and explains itself) when the
# Svenager server or the whole network is down. Set any http(s) URL to show
# something else instead.
kiosk_url: "file:///usr/local/share/svenager-kiosk/index.html"

# Well-known endpoint used by the local page to tell "server down" apart
# from "network down".
kiosk_connectivity_url: "http://detectportal.firefox.com/success.txt"

# Optional second screen with its own page. Set kiosk_second_url to show it
# fullscreen on kiosk_second_output while kiosk_url stays on kiosk_output.
# Output names as sway reports them (swaymsg -t get_outputs); a Raspberry
# Pi's two HDMI ports are HDMI-A-1 and HDMI-A-2. Empty: one screen.
kiosk_second_url: ""
kiosk_output: HDMI-A-1
kiosk_second_output: HDMI-A-2

# Display mode for every screen, e.g. 1920x1080 or 1920x1080@60Hz, to keep
# a Raspberry Pi off 4K. Falls back to the screen's preferred mode when it
# lacks the given one. Empty: preferred mode. Needs the sway compositor.
kiosk_resolution: ""

kiosk_user: kiosk
kiosk_vnc_port: 5900

# Wayland compositor the kiosk session runs in. sway (wlroots, packaged in
# Debian 12/13 and Raspberry Pi OS, wayvnc's reference compositor)
# implements the virtual pointer/keyboard protocols, so the Svenager remote
# view can control the screen. cage stays available as a watch-only
# fallback (no virtual input support).
kiosk_compositor: sway

# Compose in software instead of GL. Turn on for virtual machines —
# virtualized GPUs (virtio/virgl) glitch white frames under GL compositing.
# Leave off on real devices (Raspberry Pi has proper GL).
kiosk_software_rendering: false

# GPU render node the compositor renders on. On a Raspberry Pi the display
# controller (vc4) has no render node; wlroots then advertises it to
# clients, Mesa hides EGL_WL_bind_wayland_display and cog's web process
# falls back to llvmpipe, burning every CPU core. "auto" picks the v3d
# render node when present, a path forces one, empty leaves wlroots' pick.
kiosk_render_device: auto
